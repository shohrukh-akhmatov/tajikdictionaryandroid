# Production ad-unit IDs (release builds only; debug always uses Google test / Yandex demo units).
#
# Committed on purpose: ad-unit IDs are not secrets, they ship inside the APK. Anything private
# (keystore passwords, API keys) belongs in local.properties, which also overrides any value here.
#
# Release builds turn ads OFF until every value below is filled in.
# Waterfall order per slot: Yandex first, Google AdMob as the fallback.

# AdMob console -> Apps -> Tajik Dictionary -> App settings (format ca-app-pub-XXXX~YYYY)
ADMOB_APP_ID=

# Pinned bottom banner on every screen except Settings (anchored adaptive banner).
ADMOB_BANNER_ID=
YANDEX_BANNER_ID=

# Pinned bottom banner on the word detail screen (separate unit so its revenue is reported apart).
ADMOB_ENTRY_BANNER_ID=
YANDEX_ENTRY_BANNER_ID=

# Interstitial after finished word-game rounds (every 3rd round, at most once per 3 minutes).
ADMOB_INTERSTITIAL_ID=
YANDEX_INTERSTITIAL_ID=

# Optional, local.properties only: comma-separated AdMob test device IDs for debug builds.
# ADMOB_TEST_DEVICE_IDS=
